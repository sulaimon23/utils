name: Release

on:
  workflow_run:
    workflows: ['Tests']
    branches: [master, beta]
    types:
      - completed

# on:
#   push:
#     branches: [master, beta]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # workflow_run fires on completion whatever the outcome, so without this
    # a failing test run would still cut a release
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write       # tags, and the changelog commit from @semantic-release/git
      issues: write         # release comments on closed issues
      pull-requests: write
      packages: write       # publishing to GitHub Packages

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
      # with:
      #   node-version: 16.x
    - name: Install dependencies
      run: npm ci
    # - name: Lint
    #   run: npm run lint-fix
   # Redundant cos tests workflow has already been run
    - name: Test
      run: npm test
    - name: Build
      run: npm run build 
    - name: Create .npmrc file
      run: |
        echo registry=https://registry.npmjs.org/ > .npmrc
        echo @sulaimon23:registry=https://npm.pkg.github.com/ >> .npmrc
        echo '//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}' >> .npmrc
    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx semantic-release
